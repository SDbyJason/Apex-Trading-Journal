<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Evidence — Sponsor banner</title>
<!-- Sponsor banner for streams and clips, the format streamers put across the
     picture ("90% OFF · USE CODE …") — as a real-time 3D scene. 25.10.2026.
       /banner.html?code=ABC123 &format=wide|tall &y=0 &lang=en|de
                   &offer=10 (percent shown) &record=1 (button: save as WebM)
     wide = 1920×1080 stage (Twitch / YouTube), tall = 1080×1920 (TikTok,
     Reels, Shorts). y moves the bar up/down in percent of the stage height
     (-40 … 40, 0 = centre). Transparent background, everything in one WebGL
     canvas so a recording is exactly what the browser source shows. -->
<style>
html,body{margin:0;background:transparent;overflow:hidden;width:100%;height:100%}
canvas{display:block}
#rec{position:fixed;left:50%;top:24px;transform:translateX(-50%);z-index:5;font:600 15px system-ui,sans-serif;padding:12px 18px;border-radius:12px;border:1px solid #c9a84c;background:#151515;color:#f4efe3;cursor:pointer;display:none}
#rec.on{background:#7a1f24;border-color:#f0636a}
#recHint{position:fixed;left:50%;top:74px;transform:translateX(-50%);font:13px system-ui,sans-serif;color:#b9b2a2;background:rgba(0,0,0,.6);padding:6px 10px;border-radius:8px;display:none;max-width:560px;text-align:center}
</style>
</head>
<body>
<button id="rec" type="button">● Record 10 seconds as video</button>
<div id="recHint"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var CODE = (q.get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 14);
  var TALL = q.get('format') === 'tall';
  var YOFF = Math.max(-40, Math.min(40, parseFloat(q.get('y')) || 0));
  var DE = (q.get('lang') || navigator.language || 'en').slice(0, 2) === 'de';
  var OFFER = Math.max(1, Math.min(99, parseInt(q.get('offer'), 10) || 10));
  var RECORD = q.get('record') === '1';
  var SW = TALL ? 1080 : 1920, SH = TALL ? 1920 : 1080;           // stage
  var BW = TALL ? 1040 : 1840, BH = TALL ? 250 : 250;              // bar
  var HEAD = CODE ? OFFER + '% OFF' : 'START FREE';
  var PILL = CODE ? (DE ? 'CODE: ' : 'USE CODE: ') + CODE : (DE ? 'KEINE KARTE NÖTIG' : 'NO CARD NEEDED');
  var SUB = DE ? 'TRADING-JOURNAL · AUTO-SYNC · REPLAY' : 'TRADING JOURNAL · AUTO-SYNC · REPLAY';

  /* ── renderer, camera ── */
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true, premultipliedAlpha: false });
  renderer.setClearColor(0x000000, 0);
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.35;
  document.body.appendChild(renderer.domElement);
  var scene = new THREE.Scene();
  // Perspective with a narrow lens: depth and parallax, but the bar still reads flat.
  var cam = new THREE.PerspectiveCamera(18, SW / SH, 10, 20000);
  var camDist = (SH / 2) / Math.tan(THREE.MathUtils.degToRad(9));
  cam.position.set(0, 0, camDist);
  function fit() {
    var w = innerWidth, h = innerHeight;
    renderer.setSize(w, h);
    cam.aspect = w / h;
    // keep the whole stage visible: fit height, or width if the window is narrower
    var dist = (SH / 2) / Math.tan(THREE.MathUtils.degToRad(9));
    if (w / h < SW / SH) dist *= (SW / SH) / (w / h);
    cam.position.z = dist; camDist = dist;
    cam.updateProjectionMatrix();
  }
  fit(); addEventListener('resize', fit);

  /* ── studio environment for real reflections: dark room, soft boxes ── */
  (function () {
    var c = document.createElement('canvas'); c.width = 1024; c.height = 512;
    var x = c.getContext('2d');
    var g = x.createLinearGradient(0, 0, 0, 512); g.addColorStop(0, '#8a6a32'); g.addColorStop(0.35, '#4a3818'); g.addColorStop(0.55, '#20180c'); g.addColorStop(1, '#0c0906');
    x.fillStyle = g; x.fillRect(0, 0, 1024, 512);
    function box(px, py, w, h, col, blur) { x.save(); x.filter = 'blur(' + blur + 'px)'; x.fillStyle = col; x.fillRect(px, py, w, h); x.restore(); }
    box(0, 0, 1024, 120, 'rgba(255,236,190,0.55)', 40);   // bright sky band
    box(120, 60, 260, 110, '#ffffff', 16);     // key softbox
    box(560, 40, 380, 60, '#ffffff', 22);      // top strip
    box(820, 210, 140, 200, '#ffd27a', 26);    // warm side
    box(40, 250, 90, 160, '#ffe9b0', 20);      // fill
    box(400, 330, 300, 30, '#ffcf5a', 16);     // floor bounce
    var t = new THREE.CanvasTexture(c); t.mapping = THREE.EquirectangularReflectionMapping; t.encoding = THREE.sRGBEncoding;
    var pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromEquirectangular(t).texture;
  })();
  var key = new THREE.DirectionalLight(0xfff3d6, 1.4); key.position.set(-900, 1100, 260); scene.add(key);   // steep from the top left: no full-face glare on flat fronts
  var rim = new THREE.DirectionalLight(0xffc85a, 1.2); rim.position.set(900, -200, 400); scene.add(rim);
  scene.add(new THREE.AmbientLight(0x3a2d18, 0.6));
  var sweepL = new THREE.PointLight(0xfff0c8, 3.0, 900, 1.6); scene.add(sweepL);

  /* ── materials ── */
  var GOLD = new THREE.MeshPhysicalMaterial({ color: 0xffd36a, metalness: 1, roughness: 0.16, clearcoat: 0.7, clearcoatRoughness: 0.12, envMapIntensity: 2.2, emissive: 0x3a2604, emissiveIntensity: 0.35 });
  var GOLD_DEEP = new THREE.MeshPhysicalMaterial({ color: 0xe0ac40, metalness: 1, roughness: 0.25, envMapIntensity: 1.8 });
  /* Phong ignores scene.environment: the tile stays black and only the lamps
     draw a lacquer highlight on it. Every PBR variant picked up the bright
     studio and turned grey. */
  var BLACK = new THREE.MeshPhongMaterial({ color: 0x060606, specular: 0x3a3222, shininess: 120 });   // piano lacquer: dark body, sharp highlight on top
  var SILVER = new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0.9, roughness: 0.18, clearcoat: 0.6, envMapIntensity: 1.8, emissive: 0x2a2a2a, emissiveIntensity: 0.5 });

  function rr(x, y, w, h, r) {
    var s = new THREE.Shape();
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
    return s;
  }

  /* ── the ET mark: lacquered black tile, gold frame inlay, four gold bars ── */
  function buildMark() {
    var g = new THREE.Group();
    var tile = new THREE.Mesh(new THREE.ExtrudeGeometry(rr(-256, -256, 512, 512, 118),
      { depth: 70, bevelEnabled: true, bevelSize: 14, bevelThickness: 14, bevelSegments: 8, curveSegments: 24 }), BLACK);
    tile.position.z = -84; g.add(tile);
    // gold frame: ring = outer minus inner rounded rect
    var ring = rr(-246, -246, 492, 492, 108);
    ring.holes.push(rr(-226, -226, 452, 452, 92));
    var frame = new THREE.Mesh(new THREE.ExtrudeGeometry(ring, { depth: 10, bevelEnabled: true, bevelSize: 3, bevelThickness: 4, bevelSegments: 4, curveSegments: 24 }), GOLD_DEEP);
    frame.position.z = 0; g.add(frame);
    [[98, 112, 287, 84], [175, 112, 91, 329], [175, 231, 189, 77], [175, 357, 189, 84]].forEach(function (b) {
      var x = b[0] - 256, y = 256 - b[1] - b[3];
      var m = new THREE.Mesh(new THREE.ExtrudeGeometry(rr(x, y, b[2], b[3], 25),
        { depth: 44, bevelEnabled: true, bevelSize: 8, bevelThickness: 9, bevelSegments: 8, curveSegments: 16 }), GOLD);
      m.position.z = 2; g.add(m);
    });
    return g;
  }

  /* ── 2D textures: bar background (animated), pill, small text ── */
  function canvasTex(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; var t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return { c: c, x: c.getContext('2d'), t: t }; }
  function rrPath(x, ctx, X, Y, W, H, R) { ctx.beginPath(); ctx.moveTo(X + R, Y); ctx.arcTo(X + W, Y, X + W, Y + H, R); ctx.arcTo(X + W, Y + H, X, Y + H, R); ctx.arcTo(X, Y + H, X, Y, R); ctx.arcTo(X, Y, X + W, Y, R); ctx.closePath(); }

  var K = 2;                                   // texture px per stage px
  var bg = canvasTex(BW * K, BH * K);
  function drawBg(t, intro) {
    var x = bg.x, w = bg.c.width, h = bg.c.height, r = 26 * K;
    x.clearRect(0, 0, w, h);
    x.save(); rrPath(0, x, 4, 4, w - 8, h - 8, r); x.clip();
    var g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#16130e'); g.addColorStop(0.55, '#0a0907'); g.addColorStop(1, '#060505');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    // fine diagonal pattern
    x.globalAlpha = 0.05; x.strokeStyle = '#e8c24a'; x.lineWidth = 2;
    for (var i = -h; i < w; i += 22 * K) { x.beginPath(); x.moveTo(i + (t * 30 % (22 * K)), h); x.lineTo(i + h + (t * 30 % (22 * K)), 0); x.stroke(); }
    x.globalAlpha = 1;
    // soft gold glow behind the headline side
    var cx = TALL ? w * 0.5 : w * 0.72, cy = TALL ? h * 0.66 : h * 0.5;
    var rg = x.createRadialGradient(cx, cy, 10, cx, cy, w * 0.35); rg.addColorStop(0, 'rgba(232,194,74,' + (0.16 + 0.05 * Math.sin(t * 2)) + ')'); rg.addColorStop(1, 'rgba(232,194,74,0)');
    x.fillStyle = rg; x.fillRect(0, 0, w, h);
    // light streak sweeping across every 4.5 s
    var p = (t % 4.5) / 4.5, sx = -w * 0.3 + p * w * 1.6;
    var sg = x.createLinearGradient(sx - 160 * K, 0, sx + 160 * K, 0);
    sg.addColorStop(0, 'rgba(255,240,200,0)'); sg.addColorStop(0.5, 'rgba(255,240,200,0.12)'); sg.addColorStop(1, 'rgba(255,240,200,0)');
    x.save(); x.transform(1, 0, -0.35, 1, 0, 0); x.fillStyle = sg; x.fillRect(0, 0, w * 1.5, h); x.restore();
    // bottom line accent (like the reference bars)
    var lg = x.createLinearGradient(0, 0, w, 0); lg.addColorStop(0, 'rgba(232,194,74,0)'); lg.addColorStop(0.5, 'rgba(249,232,148,0.9)'); lg.addColorStop(1, 'rgba(232,194,74,0)');
    x.fillStyle = lg; x.fillRect(0, h - 7 * K, w, 3 * K);
    x.restore();
    // border with a travelling highlight
    rrPath(0, x, 4, 4, w - 8, h - 8, r);
    var per = 2 * (w + h), pos = ((t * 0.18) % 1) * per;
    var hx = pos < w ? pos : pos < w + h ? w : pos < 2 * w + h ? w - (pos - w - h) : 0;
    var bgd = x.createRadialGradient(hx, pos < w ? 0 : pos < 2 * w + h && pos > w + h ? h : h / 2, 0, hx, h / 2, w * 0.25);
    bgd.addColorStop(0, 'rgba(255,246,207,1)'); bgd.addColorStop(1, 'rgba(174,128,26,0.55)');
    x.lineWidth = 4 * K; x.strokeStyle = bgd; x.stroke();
    bg.t.needsUpdate = true;
  }
  var bar = new THREE.Mesh(new THREE.PlaneGeometry(BW, BH), new THREE.MeshBasicMaterial({ map: bg.t, transparent: true, toneMapped: false }));

  var pill = canvasTex(TALL ? 900 : 1100, 160);
  var PW = TALL ? 450 : 550, PH = TALL ? 80 : 90;
  function drawPill(t) {
    var x = pill.x, w = pill.c.width, h = pill.c.height;
    x.clearRect(0, 0, w, h);
    rrPath(0, x, 6, 6, w - 12, h - 12, (h - 12) / 2);
    var g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#1d1a14'); g.addColorStop(1, '#0d0c09');
    x.fillStyle = g; x.fill();
    x.lineWidth = 6; var bd = x.createLinearGradient(0, 0, w, 0);
    var s = (t * 0.35) % 1;
    bd.addColorStop(0, '#AE801A'); bd.addColorStop(Math.max(0, s - 0.08), '#E8C24A'); bd.addColorStop(s, '#FFF6CF'); bd.addColorStop(Math.min(1, s + 0.08), '#E8C24A'); bd.addColorStop(1, '#AE801A');
    x.strokeStyle = bd; x.stroke();
    x.save(); x.clip();
    var sx = -w * 0.4 + ((t % 3) / 3) * w * 1.8, sg = x.createLinearGradient(sx - 120, 0, sx + 120, 0);
    sg.addColorStop(0, 'rgba(255,240,200,0)'); sg.addColorStop(0.5, 'rgba(255,240,200,0.18)'); sg.addColorStop(1, 'rgba(255,240,200,0)');
    x.fillStyle = sg; x.fillRect(0, 0, w, h); x.restore();
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = '700 64px "Segoe UI","Helvetica Neue",Arial,sans-serif';
    var parts = PILL.split(':'), label = parts.length > 1 ? parts[0] + ':' : '', val = parts.length > 1 ? parts.slice(1).join(':') : PILL;
    var lw = label ? x.measureText(label + ' ').width : 0;
    x.font = '800 70px "Segoe UI","Helvetica Neue",Arial,sans-serif';
    var vw = x.measureText(val.trim()).width, total = lw + vw, startX = w / 2 - total / 2;
    if (label) { x.font = '700 64px "Segoe UI","Helvetica Neue",Arial,sans-serif'; x.fillStyle = '#d9d2c2'; x.textAlign = 'left'; x.fillText(label, startX, h / 2 + 3); }
    x.font = '800 70px "Segoe UI","Helvetica Neue",Arial,sans-serif'; x.textAlign = 'left';
    var vg = x.createLinearGradient(0, 30, 0, h - 30); vg.addColorStop(0, '#FFF6CF'); vg.addColorStop(1, '#E8C24A');
    x.fillStyle = vg; x.fillText(val.trim(), startX + lw, h / 2 + 4);
    pill.t.needsUpdate = true;
  }
  var pillMesh = new THREE.Mesh(new THREE.PlaneGeometry(PW, PH), new THREE.MeshBasicMaterial({ map: pill.t, transparent: true, toneMapped: false }));

  var sub = canvasTex(1400, 90);
  (function () {
    var x = sub.x; x.clearRect(0, 0, 1400, 90); x.textBaseline = 'middle'; x.fillStyle = '#c9a84c';
    x.font = '700 46px "Segoe UI","Helvetica Neue",Arial,sans-serif';
    var txt = SUB.split('').join(String.fromCharCode(8202));   // hair-space tracking
    x.fillText(txt, 4, 46); sub.t.needsUpdate = true;
  })();
  var subMesh = new THREE.Mesh(new THREE.PlaneGeometry(700, 45), new THREE.MeshBasicMaterial({ map: sub.t, transparent: true, toneMapped: false }));

  /* ── sparkles: additive points drifting up out of the bar ── */
  var spN = 90, spPos = new Float32Array(spN * 3), spSeed = [];
  for (var i = 0; i < spN; i++) { spSeed.push({ x: (Math.random() - 0.5) * BW * 0.96, y: (Math.random() - 0.5) * BH, s: 0.3 + Math.random(), p: Math.random() }); }
  var spGeo = new THREE.BufferGeometry(); spGeo.setAttribute('position', new THREE.BufferAttribute(spPos, 3));
  var dot = canvasTex(64, 64);
  (function () { var x = dot.x, g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,248,220,1)'); g.addColorStop(0.3, 'rgba(255,214,110,0.8)'); g.addColorStop(1, 'rgba(255,200,80,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); dot.t.needsUpdate = true; })();
  var sparks = new THREE.Points(spGeo, new THREE.PointsMaterial({ size: 9, map: dot.t, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false }));

  /* ── assemble ── */
  var root = new THREE.Group(); scene.add(root);
  root.add(bar); bar.position.z = -40;
  root.add(sparks); sparks.position.z = 30;
  var mark = buildMark();
  var markSize = TALL ? 150 : 196;
  mark.scale.setScalar(markSize / 512);
  root.add(mark);
  var word = null, head = null;
  root.add(pillMesh); root.add(subMesh);

  // layout positions (stage px, bar centred at 0,0)
  var L = {};
  if (TALL) {
    L.mark = [-BW / 2 + 110, 0]; L.word = [-BW / 2 + 200, 22]; L.sub = [-BW / 2 + 200, -30];
    L.head = [BW / 2 - 250, 44]; L.pill = [BW / 2 - 250, -58];
  } else {
    L.mark = [-BW / 2 + 150, 0]; L.word = [-BW / 2 + 280, 24]; L.sub = [-BW / 2 + 280 + 350, -40];
    L.head = [BW / 2 - 400, 52]; L.pill = [BW / 2 - 400, -72];
  }
  mark.position.set(L.mark[0], L.mark[1], 40);
  pillMesh.position.set(L.pill[0], L.pill[1], 10);
  subMesh.position.set(L.sub[0], L.sub[1], 5);
  if (TALL) { subMesh.scale.setScalar(0.42); }

  /* 3D text: EVIDENCE (silver) and the offer (gold) */
  new THREE.FontLoader().load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {
    function text(str, size, depth, mat, bevel) {
      var g = new THREE.TextGeometry(str, { font: font, size: size, height: depth, curveSegments: 10, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel * 0.6, bevelSegments: 5 });
      g.computeBoundingBox(); var bb = g.boundingBox;
      g.translate(-(bb.max.x + bb.min.x) / 2, -(bb.max.y + bb.min.y) / 2, 0);
      return { mesh: new THREE.Mesh(g, mat), w: bb.max.x - bb.min.x, h: bb.max.y - bb.min.y };
    }
    var wd = text('EVIDENCE', TALL ? 40 : 58, 14, SILVER, 3);
    word = wd.mesh; word.position.set(L.word[0] + wd.w / 2, L.word[1], 20); root.add(word);
    var hd = text(HEAD, TALL ? 70 : 92, 26, GOLD, 4);
    head = hd.mesh;
    var maxW = TALL ? 440 : 700; if (hd.w > maxW) head.scale.setScalar(maxW / hd.w);
    head.position.set(L.head[0], L.head[1], 30); root.add(head);
    head.userData.base = head.scale.x;
    // the small line sits left-aligned under the wordmark (plane is 700 wide, centred)
    subMesh.position.x = L.word[0] + 350 * (TALL ? 0.42 : 1);
  });

  /* ── animation ── */
  var T0 = performance.now() / 1000;
  function easeOut(x) { x = Math.max(0, Math.min(1, x)); return 1 - Math.pow(1 - x, 3); }
  function back(x) { x = Math.max(0, Math.min(1, x)); var c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  var recStart = null;

  function frame() {
    requestAnimationFrame(frame);
    var now = performance.now() / 1000, t = now - T0;
    var it = recStart != null ? now - recStart : t;           // intro restarts when recording
    var yStage = -(YOFF / 100) * SH;
    root.position.y = yStage;

    // intro: bar wipes open from the centre (0–0.7 s), contents pop in after
    var open = easeOut(it / 0.7);
    bar.scale.set(Math.max(0.001, open), 1, 1);
    bar.material.opacity = open;
    var pop = back((it - 0.45) / 0.6);
    mark.scale.setScalar((markSize / 512) * Math.max(0.001, pop));
    // the mark: spins in, then breathes; a full turn every 9 s
    var cyc = (it - 1.2) % 9, turn = cyc > 7.6 ? easeOut((cyc - 7.6) / 1.2) * Math.PI * 2 : 0;
    mark.rotation.y = (1 - easeOut(it / 1.2)) * Math.PI * 3 + turn + Math.sin(now * 0.9) * 0.22;
    mark.rotation.x = Math.sin(now * 0.7) * 0.08;
    mark.position.y = L.mark[1] + Math.sin(now * 1.3) * 4;
    if (word) { var wp = easeOut((it - 0.7) / 0.6); word.position.y = L.word[1] - (1 - wp) * 30; word.material.opacity = 1; word.visible = wp > 0.01; word.rotation.x = (1 - wp) * 0.9; }
    subMesh.material.opacity = easeOut((it - 1.0) / 0.6); subMesh.visible = subMesh.material.opacity > 0.01;
    if (head) {
      var hp = back((it - 0.9) / 0.55), base = head.userData.base || 1;
      var pulse = 1 + 0.035 * Math.max(0, Math.sin(now * 2.4)) ;
      head.scale.setScalar(base * Math.max(0.001, hp) * pulse);
      head.rotation.y = Math.sin(now * 0.8) * 0.12; head.rotation.x = Math.sin(now * 0.6) * 0.05;
    }
    var pp = easeOut((it - 1.2) / 0.5);
    pillMesh.scale.set(Math.max(0.001, pp), 1, 1); pillMesh.material.opacity = pp;
    drawBg(t, open); drawPill(t);

    // the moving light that rakes across the gold
    var lx = -BW / 2 + ((t % 4.5) / 4.5) * BW * 1.2;
    sweepL.position.set(lx, yStage + 120, 260);

    // sparkles rise and fade
    for (var i = 0; i < spN; i++) {
      var s = spSeed[i], ph = (t * 0.18 * s.s + s.p) % 1;
      spPos[i * 3] = s.x + Math.sin(t * s.s + i) * 6;
      spPos[i * 3 + 1] = s.y + ph * 140 - 20;
      spPos[i * 3 + 2] = 30 + ph * 40;
    }
    spGeo.attributes.position.needsUpdate = true;
    sparks.material.opacity = 0.75 * open;

    renderer.render(scene, cam);
  }
  requestAnimationFrame(frame);

  /* ── record 10 s as WebM with transparency ── */
  var btn = document.getElementById('rec'), hint = document.getElementById('recHint');
  if (RECORD) { btn.style.display = 'block'; hint.style.display = 'block';
    btn.textContent = DE ? '● 10 Sekunden als Video aufnehmen' : '● Record 10 seconds as video';
    hint.textContent = DE ? 'WebM mit durchsichtigem Hintergrund (Chrome/Edge). Fenster dabei im Vordergrund lassen. In OBS als Medienquelle mit „Wiederholen“.'
                          : 'WebM with a transparent background (Chrome/Edge). Keep this window in front while it records. In OBS: media source with “Loop”.'; }
  btn.onclick = function () {
    var type = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].filter(function (t) { return window.MediaRecorder && MediaRecorder.isTypeSupported(t); })[0];
    if (!type) { hint.textContent = DE ? 'Dieser Browser kann nicht aufnehmen — bitte Chrome oder Edge.' : 'This browser cannot record — use Chrome or Edge.'; return; }
    var chunks = [], mr = new MediaRecorder(renderer.domElement.captureStream(60), { mimeType: type, videoBitsPerSecond: 16e6 });
    mr.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = function () {
      btn.classList.remove('on'); btn.textContent = DE ? '● Nochmal aufnehmen' : '● Record again'; btn.disabled = false;
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
      a.download = 'evidence-banner-' + (TALL ? 'tall' : 'wide') + (CODE ? '-' + CODE : '') + '.webm'; a.click();
    };
    recStart = performance.now() / 1000;      // replay the intro inside the recording
    mr.start(250); btn.disabled = true; btn.classList.add('on'); btn.textContent = DE ? '■ Nimmt auf …' : '■ Recording …';
    setTimeout(function () { mr.stop(); }, 10000);
  };
})();
</script>
</body>
</html>
