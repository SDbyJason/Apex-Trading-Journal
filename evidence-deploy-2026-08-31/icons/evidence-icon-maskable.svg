<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mkGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9E894"/>
      <stop offset="0.42" stop-color="#E8C24A"/>
      <stop offset="1" stop-color="#AE801A"/>
    </linearGradient>
    <radialGradient id="mkShine" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.4" stop-color="#FFF8DE" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#FFF0BE" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="mkMono">
      <rect x="98" y="112" width="287" height="84" rx="25"/>
      <rect x="175" y="112" width="91" height="329" rx="25"/>
      <rect x="175" y="231" width="189" height="77" rx="25"/>
      <rect x="175" y="357" width="189" height="84" rx="25"/>
    </clipPath>
  </defs>
  <!-- Vollflaechiger Hintergrund; die Marke sitzt auf 70 % Groesse in der
       maskable safe zone, damit runde Masken nichts abschneiden. -->
  <rect width="512" height="512" fill="#131313"/>
  <g transform="translate(76.8 76.8) scale(0.7)">
    <rect x="9" y="9" width="494" height="494" rx="110" fill="none" stroke="#8C7220" stroke-width="18"/>
    <g clip-path="url(#mkMono)">
      <rect x="98" y="112" width="287" height="84" rx="25" fill="url(#mkGold)"/>
      <rect x="175" y="112" width="91" height="329" rx="25" fill="url(#mkGold)"/>
      <rect x="175" y="231" width="189" height="77" rx="25" fill="url(#mkGold)"/>
      <rect x="175" y="357" width="189" height="84" rx="25" fill="url(#mkGold)"/>
      <circle cx="347" cy="147" r="77" fill="url(#mkShine)"/>
    </g>
  </g>
</svg>
